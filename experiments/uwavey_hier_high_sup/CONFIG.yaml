# HIER-HIGH-SUP configuration (all values PREDECLARED / locked)
dataset: UWaveGestureLibraryY
seed: 42
split:
  source: experiments.uwavey_nested_hierarchical.runner.load_data   # canonical
  train: 761
  validation: 135
  test: 3582
  T: 315
  n_classes: 8
normalization: per_sample_z_norm

# ---- locked budgets (read from the implementation, then asserted) ----
budgets:
  B_base: 9996
  B_high: 19992            # final classifier budget, ALL methods equal
  N_G: 17993               # identical to R5-HIGH (rho=0.1 convention)
  N_H: 1999                # supervised top-N from the hierarchical pool
  rho: 0.1                 # frozen documented R5-HIGH allocation (no re-search)

# ---- locked expanded MiniROCKET (identical to HIER-HIGH) ----
minirocket:
  library: aeon
  n_kernels: 19992         # = total features: 84 kernels x 238 quantiles
  random_state: 42
  fit: train_only

# ---- locked hierarchy (identical to HIER-HIGH) ----
hierarchy:
  levels: [1, 2, 4, 8, 16]
  construction: recursive binary KMeans (n_clusters=2, n_init=10, random_state=42)
  latents: frozen seed-42 SSLTemporalEncoder checkpoint, TRAIN latents only
  val_test: transform-only
  regression_artifact: results/uwavey_nested_hierarchical/seed42/hierarchy_assignments.npy

# ---- locked candidate pool (identical to HIER-HIGH) ----
candidates:
  H_kernels: 14994         # expanded-bank kernels [4998:19992]
  edges: 30                # 2+4+8+16 occupied-children edges
  total: 449820
  delta_definition: occupancy-weighted PPV_{m,c} - PPV_{m,p}, zero-sum per parent

# ---- THE ONE CHANGE ----
selection:
  previous: label-free hierarchy-energy allocation (level_budgets + select_carriers)
  new: fold-internal supervised ANOVA-F, top-1999 of the full 449,820 pool
  mechanism: experiments.uwavey_capacity_scaled.runner.top_f_select  # f_classif, nan->0, stable argsort
  final_stage: full-dev (train+val) ANOVA-F per the existing canonical R5 protocol
  cv_diagnostic: 5-fold StratifiedKFold(42), fold-internal top_f_select, reported only

forbidden: [level_energy, null_energy, proportional_energy_allocation,
            largest_remainder_budgeting, K2_4437_K4_3767_K8_3128_K16_3662]

classifier:
  model: RidgeClassifierCV
  alphas: np.logspace(-4, 4, 20)
  final_fit: train+validation
  test_eval: once

gates:
  mr_high_reproduction: {ref: 0.7477, tol: 0.002}
  hierarchy_equality: array_equal(reg16_tr, stored hierarchy_assignments.npy)
  split_identity: loader indices == stored uwavey_nested indices
