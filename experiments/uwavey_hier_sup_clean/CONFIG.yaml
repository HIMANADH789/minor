# HIER-SUP-CLEAN configuration - ALL VALUES PREDECLARED / LOCKED
experiment: hier_sup_clean
label: HIER-SUP-CLEAN
dataset: UWaveGestureLibraryY
seed: 42

split:
  train: 761
  validation: 135
  test: 3582
  T: 315
  n_classes: 8
  source: canonical UWaveY loader (asserted vs stored
          results/uwavey_nested_hierarchical/seed42 indices)
normalization: per_sample_z_norm

telescoping_formulation:
  ppv_level_0: 0
  root_increment: "Delta^(1)_m = PPV_m^(1) - PPV_m^(0) = PPV_m^(1)"
  deeper: "Delta_{m,c}^(K) = PPV_{m,c}^(K) - PPV_{m,parent(c)}^(K/2), K in {2,4,8,16}"
  parent_rule: occupancy-weighted child mean; sum_c (n_c/n_p) Delta_{m,c} = 0

budgets:
  B_base: 9996
  B_high: 19992

minirocket:
  implementation: aeon MiniRocket
  n_kernels: 19992
  random_state: 42
  physical_kernels: 84
  quantiles_per_kernel: 238
  fit: TRAIN signals only

hierarchy:
  K_levels: [1, 2, 4, 8, 16]
  encoder: frozen seed-42 SSLTemporalEncoder (TRAIN latents only)
  clustering: recursive 2-means (n_clusters=2, n_init=10, random_state=42)
  val_test: transform-only

candidate_pool:
  root_increments_D1: 19992
  delta_candidates_D2_D4_D8_D16: 449820
  edges: 30
  unified: 469812
  column_order: [D1, D2, D4, D8, D16]

selection:
  method: top_f_select (sklearn f_classif, NaN->0, stable argsort, top-N)
  stages: ONE ranking over the full unified pool
  labels: train+validation (canonical R5 final-stage protocol)
  no_rho: true
  no_GH_split: true
  no_protected_budgets: true
  no_per_level_quota: true
  no_energy_allocation: true
  no_empirical_bayes: true
  no_moderated_F: true

classifier:
  model: RidgeClassifierCV
  alphas: logspace(-4, 4, 20)
  protocol: identical to HIER-CONTINUOUS-SUP / R5-HIGH

equivalence_gate:
  reference: results/uwavey_hier_continuous_sup/seed42
  expected: IDENTICAL
  smoke: skipped

outputs: results/uwavey_hier_sup_clean/seed42
